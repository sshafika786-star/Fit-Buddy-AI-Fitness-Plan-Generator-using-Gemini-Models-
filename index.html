<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitBuddy - AI Workout Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1f2937, #111827);
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    color: #111827;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-top: 14px;
    margin-bottom: 6px;
    color: #374151;
    font-size: 0.9rem;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #1d4ed8; }
  @media (max-width: 480px) {
    .card { padding: 20px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🏋️ FitBuddy - AI Workout Generator</h1>
    <form action="/generate-workout" method="post">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" required>

      <label for="user_id">User ID</label>
      <input type="number" id="user_id" name="user_id" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" required>

      <label for="weight">Weight (kg)</label>
      <input type="number" step="0.1" id="weight" name="weight" required>

      <label for="goal">Fitness Goal</label>
      <input type="text" id="goal" name="goal" placeholder="e.g. weight loss, flexibility" required>

      <label for="intensity">Workout Intensity</label>
      <select id="intensity" name="intensity">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>
  </div>
</body>
</html>
